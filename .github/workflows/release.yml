name: Release Desktop

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@4.9.2 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web assets
        run: |
          yarn web:build
          node tools/prepare-web-assets.cjs

      - name: Set package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs');const path='apps/desktop/package.json';const data=JSON.parse(fs.readFileSync(path));data.version=process.env.RELEASE_TAG.replace(/^v/,'');fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n')"

      - name: Package Electron app
        run: yarn workspace @aijee/desktop build --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aijee-desktop-${{ matrix.name }}
          path: |
            apps/desktop/dist/**/*.AppImage
            apps/desktop/dist/**/*.deb
            apps/desktop/dist/**/*.dmg
            apps/desktop/dist/**/*.exe
            apps/desktop/dist/**/*.zip
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
